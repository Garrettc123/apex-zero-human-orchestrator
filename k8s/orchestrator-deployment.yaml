apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-orchestrator
  namespace: apex-ai-production
  labels:
    app: apex-orchestrator
    component: zero-human-grid
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-orchestrator
  template:
    metadata:
      labels:
        app: apex-orchestrator
        component: zero-human-grid
    spec:
      containers:
      - name: orchestrator
        image: YOUR_ECR_OR_GHCR/apex-orchestrator:1.0.0-breakthrough
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: apex-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: apex-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: apex-secrets
              key: redis-url
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: apex-secrets
              key: github-token
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: apex-secrets
              key: stripe-secret-key
        - name: ENVIRONMENT
          value: production
        - name: PRODUCT_CATALOG_PATH
          value: /app/catalog/PRODUCT_CATALOG.yaml
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: catalog
          mountPath: /app/catalog
          readOnly: true
      volumes:
      - name: catalog
        configMap:
          name: product-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: apex-orchestrator
  namespace: apex-ai-production
spec:
  selector:
    app: apex-orchestrator
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog
  namespace: apex-ai-production
data:
  PRODUCT_CATALOG.yaml: |
    templates:
      mesh_messenger:
        name: Mesh Messenger
        description: Decentralized encrypted messaging with monetizable channels
        target_mrr_default: 8000
        scaffold:
          README.md: |
            # Mesh Messenger
            Autonomous product generated by Apex Zero-Human Grid.
          src/main.py: |
            print("Mesh Messenger live")
          pricing.yaml: |
            plans:
              - name: pro
                price: 29
                interval: month
      data_monetization_api:
        name: Data Monetization API
        description: Privacy-preserving data marketplace + API
        target_mrr_default: 15000
        scaffold:
          README.md: |
            # Data Monetization API
            Generated by Zero-Human Grid.
          api/main.py: |
            from fastapi import FastAPI
            app = FastAPI()
            @app.get("/health")
            def health(): return {"status": "ok"}
          pricing.yaml: |
            plans:
              - name: enterprise
                price: 499
                interval: month
      governance_platform:
        name: Governance Platform
        description: Policy + compliance automation for regulated industries
        target_mrr_default: 12000
        scaffold:
          README.md: |
            # Governance Platform
            Zero-Human generated.
          core/policy.py: |
            # Policy engine stub
          pricing.yaml: |
            plans:
              - name: compliance
                price: 199
                interval: month
      trading_bot:
        name: Autonomous Trading Bot
        description: Risk-gated algorithmic trading with human capital approval
        target_mrr_default: 25000
        scaffold:
          README.md: |
            # Trading Bot
            Capital actions require multi-gate approval.
          bot/strategy.py: |
            # Strategy with confidence gates
          pricing.yaml: |
            plans:
              - name: alpha
                price: 999
                interval: month
